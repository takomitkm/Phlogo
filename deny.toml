# deny.toml — cargo-deny 门禁脚手架（P0-05 建立；P1 建起 Rust workspace/core-rs/Cargo.toml 后正式生效）
# 用法（未来 CI）：cargo deny check licenses / advisories / bans
# 许可证策略依据：方案 §16、CONVENTIONS §2.11。copyleft（GPL/AGPL）进入分发产物需人工评审，不默认加白。

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
