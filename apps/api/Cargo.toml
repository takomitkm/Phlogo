[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
tower = { version = "0.5", features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
apalis-sql.workspace = true
distribution = { path = "../../crates/distribution" }
filter = { path = "../../crates/filter" }
worker = { path = "../worker" }
jsonwebtoken.workspace = true
utoipa.workspace = true
sqlx.workspace = true
uuid.workspace = true
api-contract = { path = "../../crates/api-contract" }
app-config = { path = "../../crates/config" }
domain = { path = "../../crates/domain" }
database = { path = "../../crates/database" }
registry = { path = "../../crates/registry" }
observability = { path = "../../crates/observability" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
